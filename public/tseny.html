<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Цены — Медицинский центр «Планета Здоровья», Красноярск</title>
<meta name="description" content="Полный прайс-лист медицинского центра «Планета Здоровья»: неврология, ортопедия, психология, развивающие занятия, экспресс-ортезирование.">
<link rel="canonical" href="https://ЗАМЕНИТЕ-НА-ДОМЕН.ru/tseny">
<link rel="icon" href="/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/img/logo-mark-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="navPlaceholder"></div>

<main>
  <div class="page-header wrap">
    <span class="eyebrow">Для пациентов</span>
    <h1>Цены</h1>
    <p class="lede">Полный прайс-лист клиники. Используйте поиск, чтобы быстро найти нужную услугу.</p>
  </div>

  <section class="section" style="padding-top:0;">
    <div class="wrap">
      <div class="disclaimer-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86l-8.18 14.18A2 2 0 0 0 3.9 21h16.2a2 2 0 0 0 1.79-2.96L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
        <p>Имеются противопоказания. Необходима консультация специалиста.</p>
      </div>

      <div class="price-toolbar">
        <div class="price-search">
          <input type="search" id="priceSearch" placeholder="Поиск по прайсу, например «ортез» или «невролог»">
        </div>
        <span id="resultCount" style="font-size:0.85rem; color:var(--ink-faint); font-weight:600; white-space:nowrap;"></span>
      </div>

      <div id="priceAccordions"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="cta-band">
        <span class="eyebrow" style="color:var(--amber);">Есть вопросы по ценам?</span>
        <h2>Уточните на консультации</h2>
        <a href="/zapis" class="btn btn-primary" style="background:#fff; color:var(--ink);">Записаться на приём</a>
      </div>
    </div>
  </section>
</main>

<div id="footerPlaceholder"></div>

<script src="/common.js"></script>
<script>
let priceData = [];

function renderAccordions(data, query) {
  const q = (query || '').trim().toLowerCase();
  const container = document.getElementById('priceAccordions');
  let visibleCount = 0;

  container.innerHTML = data.map((cat, idx) => {
    const items = cat.items.map(item => {
      const matches = !q || item.title.toLowerCase().includes(q) || cat.title.toLowerCase().includes(q);
      if (matches) visibleCount++;
      return `<tr class="${matches ? '' : 'is-hidden'}"><td class="p-title">${esc(item.title)}</td><td class="p-price">${esc(item.price_note)}</td></tr>`;
    }).join('');
    const catHasMatch = !q || cat.items.some(i => i.title.toLowerCase().includes(q)) || cat.title.toLowerCase().includes(q);
    const openClass = (q && catHasMatch) ? 'is-open' : (idx === 0 && !q ? '' : '');
    return `
      <div class="accordion ${openClass} ${(q && !catHasMatch) ? 'is-hidden' : ''}" data-cat="${idx}">
        <button type="button" class="accordion-head" aria-expanded="false">
          <h3>${esc(cat.title)}</h3>
          <span class="meta">${cat.items.length} поз. <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block; vertical-align:-4px; margin-left:6px;"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
        <div class="accordion-body">
          ${cat.intro ? `<p class="accordion-intro">${esc(cat.intro)}</p>` : ''}
          <table class="price-table">${items}</table>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('resultCount').textContent = q ? `Найдено позиций: ${visibleCount}` : '';

  container.querySelectorAll('.accordion-head').forEach(btn => {
    btn.addEventListener('click', () => {
      const acc = btn.closest('.accordion');
      const isOpen = acc.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', String(isOpen));
    });
  });

  if (q) {
    container.querySelectorAll('.accordion').forEach(acc => {
      if (!acc.classList.contains('is-hidden')) acc.classList.add('is-open');
    });
  }
}

async function loadPrices() {
  priceData = await fetch('/api/price-index').then(r => r.json());
  renderAccordions(priceData, '');
}
document.getElementById('priceSearch').addEventListener('input', (e) => {
  renderAccordions(priceData, e.target.value);
});
loadPrices();
</script>
</body>
</html>
