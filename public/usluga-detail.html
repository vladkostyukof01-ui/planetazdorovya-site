<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Направление — Медицинский центр «Планета Здоровья»</title>
<meta name="description" id="pageDescription" content="Медицинские услуги в Красноярске.">
<link rel="icon" href="/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/img/logo-mark-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="navPlaceholder"></div>

<main>
  <div class="page-header wrap">
    <div class="breadcrumb"><a href="/uslugi">Направления</a> / <span id="crumbTitle"></span></div>
    <span class="eyebrow">Направление</span>
    <h1 id="serviceTitle"></h1>
    <p class="lede" id="serviceShortDesc"></p>
  </div>

  <section class="section" style="padding-top:0;">
    <div class="wrap split-layout">
      <div class="body-rich" id="serviceBody"></div>
      <div>
        <div class="hero-photo" style="width:100%; margin-bottom:24px;" id="servicePhotoWrap">
          <img id="servicePhoto" src="" alt="">
        </div>
        <div class="form-card" style="padding:26px; box-shadow:none; border:1px solid var(--line);">
          <h3 style="margin-bottom:12px;">Цены по направлению</h3>
          <div id="servicePrices" style="font-size:0.94rem;"></div>
          <a href="/zapis" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:18px;">Записаться на приём</a>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="disclaimer-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86l-8.18 14.18A2 2 0 0 0 3.9 21h16.2a2 2 0 0 0 1.79-2.96L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
        <p>Имеются противопоказания. Необходима консультация специалиста.</p>
      </div>
    </div>
  </section>
</main>

<div id="footerPlaceholder"></div>

<script src="/common.js"></script>
<script>
function slugFromPath() {
  const parts = window.location.pathname.split('/').filter(Boolean);
  return parts[parts.length - 1];
}
async function loadService() {
  const slug = slugFromPath();
  try {
    const [service, priceIndex] = await Promise.all([
      fetch('/api/services/' + slug).then(r => { if (!r.ok) throw new Error('not found'); return r.json(); }),
      fetch('/api/price-index').then(r => r.json()),
    ]);
    document.getElementById('serviceTitle').textContent = service.title;
    document.getElementById('crumbTitle').textContent = service.title;
    document.getElementById('serviceShortDesc').textContent = service.short_desc;
    document.getElementById('serviceBody').innerHTML = (service.body || '').split('\n\n').filter(Boolean).map(block => {
      if (block.trim().startsWith('- ')) {
        const lines = block.split('\n').filter(l => l.trim().startsWith('- '));
        return '<ul>' + lines.map(l => `<li>${esc(l.replace(/^- /, ''))}</li>`).join('') + '</ul>';
      }
      return `<p>${escMultiline(block)}</p>`;
    }).join('');
    if (service.image) {
      document.getElementById('servicePhoto').src = service.image;
      document.getElementById('servicePhoto').alt = service.title;
    } else {
      document.getElementById('servicePhotoWrap').style.display = 'none';
    }
    const cat = priceIndex.find(c => c.slug === slug);
    if (cat && cat.items.length) {
      document.getElementById('servicePrices').innerHTML = cat.items.map(i => `
        <div style="display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--line);">
          <span style="color:var(--ink-soft);">${esc(i.title)}</span>
          <span class="mono" style="font-weight:700; color:var(--signal-deep); white-space:nowrap;">${esc(i.price_note)}</span>
        </div>
      `).join('');
    } else {
      document.getElementById('servicePrices').innerHTML = '<p style="color:var(--ink-faint);">Уточните стоимость на консультации.</p>';
    }
  } catch (err) {
    document.querySelector('main').innerHTML = '<div class="wrap section"><h1>Направление не найдено</h1><p><a href="/uslugi">Вернуться к списку направлений</a></p></div>';
  }
}
loadService();
</script>
</body>
</html>
